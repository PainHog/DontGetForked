name: CI

# Validates the system: manifest sanity, pack integrity, compiled-packs-match-source,
# template compilation, and the unit/smoke tests. Runs against the COMMITTED packs
# (it does NOT rebuild first) so it catches a source edit that wasn't rebuilt and committed.
# On request only (Actions → CI → Run workflow) since the repository went private, so it
# doesn't spend the account's Actions minutes on every push (Richard, 2026-10-13); the same
# checks run locally before every commit (npm run check).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Validate (manifest, packs, templates)
        run: npm run validate

      - name: Unit tests
        run: npm test
